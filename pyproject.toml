[project]
name = "pii-synthea"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.1.0",
    "gliner2[train]>=0.2.0",
    "peft>=0.21.0",
    "pyarrow>=25.0.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "protobuf>=7.36.2",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "datasets", "gliner2", "gliner2.*"]
ignore_missing_imports = true



